[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true

[[inputs.exec]]
  commands = [["sh", "-c", "printf 'qps_iteration,mission=M06,source=telegraf pulse=1i,bg_open=1i,dov=0i\\n'"]]
  timeout = "5s"
  data_format = "influx"

[[outputs.file]]
  files = ["artifacts/m06/qps_observer.out"]
  data_format = "influx"
